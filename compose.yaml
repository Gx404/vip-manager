name: gx404-memberships
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Please set PUBLIC_ORIGIN in .env}
      PUBLIC_DASHBOARD: ${PUBLIC_DASHBOARD:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Please set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TRUST_PROXY: "true"
      TRUSTED_PROXY_RANGES: ${TRUSTED_PROXY_RANGES:-loopback,linklocal,uniquelocal}
      EMAIL_CONFIG_FILE: /app/backend/data/email-settings.json
      EMAIL_NOTIFICATIONS: ${EMAIL_NOTIFICATIONS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      EMAIL_REMINDER_HOUR: ${EMAIL_REMINDER_HOUR:-9}
      EMAIL_REMINDER_MINUTE: ${EMAIL_REMINDER_MINUTE:-0}
    volumes:
      - membership_data:/app/backend/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
volumes:
  membership_data:
